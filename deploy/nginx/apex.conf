# ==============================================================
# CẤU HÌNH NGINX REVERSE PROXY CHO APEX FINTECH
# Đường dẫn cài đặt trên Ubuntu/Debian: /etc/nginx/sites-available/apex.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/apex.conf /etc/nginx/sites-enabled/
# ==============================================================

# 1. CẤU HÌNH CHO TÊN MIỀN QUẢN TRỊ ADMIN (crm.hanghoaphaisinh.net)
server {
    listen 80;
    listen [::]:80;
    server_name crm.hanghoaphaisinh.net;

    # Tự động chuyển hướng HTTP sang HTTPS (sau khi cài Certbot SSL)
    # return 301 https://$host$request_uri;

    # Giới hạn kích thước tải lên (cho việc upload/lưu code studio)
    client_max_body_size 25M;

    # Gzip nén dữ liệu giúp tải trang siêu tốc
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Chuyển tiếp đầy đủ Header danh tính người dùng và giao thức
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSockets / SSE nếu có
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts chống treo kết nối
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 2. CẤU HÌNH CHO CÁC TÊN MIỀN LANDING PAGE KHÁC (MULTI-DOMAIN ROUTING)
# Đón tất cả các tên miền landing trỏ về máy chủ (dautuhanghoa.vn, *.hanghoaphaisinh.net,...)
server {
    listen 80;
    listen [::]:80;
    server_name dautuhanghoa.vn www.dautuhanghoa.vn *.hanghoaphaisinh.net;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    location / {
        # Đẩy trực tiếp về Apex Backend để bộ định tuyến Edge Router phân giải tên miền
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
